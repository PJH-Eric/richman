# Render 免費方案的部署設定
# 免費方案會休眠，第一個人進來要等 30～60 秒冷啟動，前端會顯示「喚醒伺服器中」。
# 房間只存在記憶體：服務重啟或休眠後，未打完的對局不會恢復。
services:
  - type: web
    name: richman
    runtime: node
    plan: free
    region: singapore
    buildCommand: ""          # 零依賴，不用安裝任何東西
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GAME_ALLOWED_ORIGIN
        sync: false           # 正式環境請填前端網址，例如 https://<帳號>.github.io
